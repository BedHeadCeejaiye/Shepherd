<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0e1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    color: white;
    user-select: none;
  }
  canvas {
    border: 3px solid #333;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    background-color: #558b2f;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #hud {
    width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
  }
  #sigils {
    letter-spacing: 2px;
    font-size: 12px;
    color: #555;
  }
  #lore-box {
    width: 580px;
    min-height: 45px;
    margin-top: 10px;
    padding: 10px;
    background: #161a23;
    border-left: 4px solid #558b2f;
    font-size: 14px;
    line-height: 1.4;
    transition: all 0.5s ease;
  }
</style>
</head>
<body>

<div id="hud">
  <span id="score-text">FRUITS GATHERED: 0 / 20</span>
  <span id="sigils" title="Unlocked Endings">[---] [---] [---]</span>
  <span id="realm-text" style="color: #a8e6cf;">REALM: EDEN'S GROVE</span>
</div>

<canvas id="gameCanvas" width="600" height="400" tabindex="0"></canvas>

<div id="lore-box">
  "The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score-text");
const realmText = document.getElementById("realm-text");
const loreBox = document.getElementById("lore-box");
const sigilsText = document.getElementById("sigils");

canvas.focus();
canvas.addEventListener("click", () => canvas.focus());

let unlocked = JSON.parse(localStorage.getItem("eden_abyss_endings")) || {
  eden: false,
  death: false,
  revelation: false,
  trueEnd: false
};

function saveEnding(key) {
  unlocked[key] = true;
  localStorage.setItem("eden_abyss_endings", JSON.stringify(unlocked));
  updateSigilHUD();
}

function allBaseEndingsUnlocked() {
  return unlocked.eden && unlocked.death && unlocked.revelation;
}

function updateSigilHUD() {
  const s1 = unlocked.eden ? "<span style='color:#a8e6cf'>[LEAF]</span>" : "[----]";
  const s2 = unlocked.death ? "<span style='color:#ff5252'>[VOID]</span>" : "[----]";
  const s3 = unlocked.revelation ? "<span style='color:#ffd700'>[EYE]</span>" : "[---]";
  const s4 = unlocked.trueEnd ? " <span style='color:#ff1744'>[CROWN]</span>" : "";
  sigilsText.innerHTML = `${s1} ${s2} ${s3}${s4}`;
}

let isUpsideDown = false;
let isTrueAbyss = false;
let gameOver = false;
let won = false;
let edenWon = false;
let trueWon = false;
let score = 0;
let eyesCollected = 0;
let targetSeals = 6;
let forbiddenTouches = 0;
let shakeTime = 0;
let glitchTimer = 0;
let flickerFrames = 0;
let watcherStunTimer = 0;
let flickerCooldown = 0; // Enforces spacing between subliminal flickers

const player = {
  x: 50,
  y: 200,
  size: 20,
  speed: 2.05
};

let item = {
  x: 300,
  y: 200,
  size: 14
};

const forbiddenFruit = {
  x: 495,
  y: 205,
  size: 14,
  active: false
};

const forestTrees = [
  { x: 60, y: 50, width: 45, height: 45, style: "round" },
  { x: 180, y: 40, width: 45, height: 45, style: "boxy" },
  { x: 310, y: 70, width: 45, height: 45, style: "round" },
  { x: 440, y: 45, width: 45, height: 45, style: "boxy" },
  { x: 120, y: 160, width: 45, height: 45, style: "boxy" },
  { x: 250, y: 180, width: 45, height: 45, style: "round" },
  { x: 400, y: 150, width: 45, height: 45, style: "boxy" },
  { x: 70, y: 290, width: 45, height: 45, style: "round" },
  { x: 190, y: 320, width: 45, height: 45, style: "boxy" },
  { x: 330, y: 300, width: 45, height: 45, style: "round" },
  { x: 450, y: 280, width: 45, height: 45, style: "boxy" }
];

const anomaly = {
  x: 520,
  y: 190,
  width: 45,
  height: 45,
  style: "round"
};

const watcher = {
  x: 550,
  y: 50,
  size: 28,
  baseSpeed: 1.15
};

const abyssLore = [
  "GENESIS 3:24 — 'He drove out the man; and placed at the east of the garden Cherubims, and a flaming sword...'",
  "EZEKIEL 1:18 — 'As for their rings, they were so high that they were dreadful; and their rings were full of eyes round about them.'",
  "JOB 26:6 — 'Sheol is naked before Him, and Abaddon has no covering.'",
  "REVELATION 9:11 — 'They had as king over them the angel of the Abyss, whose name in Hebrew is Abaddon.'",
  "MATTHEW 8:12 — 'Thrown outside into the darkness, where there will be weeping and gnashing of teeth.'",
  "THE SIXTH SEAL SHATTERS. ONE REMAINS.",
  "REVELATION 8:1 — 'When he opened the seventh seal, there was silence in heaven for about half an hour.'",
  "ISAIAH 14:15 — 'Yet you are brought down to Sheol, to the far reaches of the pit.'",
  "THE THRONE IS EMPTY. YOU HAVE BECOME THE WATCHER."
];

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if (gameOver && e.key.toLowerCase() === "r") {
    resetGame();
  }
});
window.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

function spawnItem() {
  let valid = false;
  while (!valid) {
    item.x = 40 + Math.random() * (canvas.width - 120);
    item.y = 40 + Math.random() * (canvas.height - 80);
    valid = true;
    if (!isUpsideDown) {
      for (const tree of forestTrees) {
        if (checkCollision(item.x, item.y, item.size, item.size, tree.x, tree.y, tree.width, tree.height)) {
          valid = false;
          break;
        }
      }
      if (checkCollision(item.x, item.y, item.size, item.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
        valid = false;
      }
    } else {
      if (Math.hypot(item.x - watcher.x, item.y - watcher.y) < 90) {
        valid = false;
      }
    }
  }
}

function triggerUpsideDown(trueMode = false) {
  isUpsideDown = true;
  isTrueAbyss = trueMode;
  targetSeals = trueMode ? 9 : 6;
  shakeTime = trueMode ? 70 : 45;
  watcherStunTimer = 45;
  score = 0;
  player.x = 60;
  player.y = 200;
  watcher.x = 540;
  watcher.y = 200;
  watcher.baseSpeed = trueMode ? 1.25 : 1.1;
  
  realmText.innerText = trueMode ? "REALM: THE BOTTOMLESS PIT" : "REALM: SHEOL // THE ABYSS";
  realmText.style.color = "#ff2a2a";
  scoreText.innerText = `SEALS BROKEN: 0 / ${targetSeals}`;
  scoreText.style.color = "#ff2a2a";
  
  loreBox.style.background = "#1a0505";
  loreBox.style.borderLeft = "4px solid #ff0000";
  loreBox.style.color = "#ff9999";
  loreBox.innerText = trueMode
    ? "YOU CONSUMED THE CORE OF KNOWLEDGE. THE ABYSS KNOWS YOUR NAME."
    : "YOU TOUCHED THE FORBIDDEN ROOT. THE SKY HAS ROLLED UP LIKE A SCROLL.";
  spawnItem();
}

function handleAnomalyTouch() {
  forbiddenTouches++;
  shakeTime = 12;

  const dx = (player.x + player.size / 2) - (anomaly.x + anomaly.width / 2);
  const dy = (player.y + player.size / 2) - (anomaly.y + anomaly.height / 2);
  const dist = Math.hypot(dx, dy) || 1;
  player.x += (dx / dist) * 24;
  player.y += (dy / dist) * 24;

  if (forbiddenTouches === 1) {
    loreBox.innerText = "The bark of this particular tree is unnaturally cold to the touch...";
  } else if (forbiddenTouches === 2) {
    loreBox.innerText = "A drop of black sap leaks from the grain. Something feels wrong.";
  } else if (forbiddenTouches === 3) {
    loreBox.innerText = "You hear faint whispers echoing up through the roots... Turn back.";
  } else if (forbiddenTouches >= 4) {
    triggerUpsideDown(false);
  }
}

function resetGame() {
  isUpsideDown = false;
  isTrueAbyss = false;
  gameOver = false;
  won = false;
  edenWon = false;
  trueWon = false;
  score = 0;
  eyesCollected = 0;
  targetSeals = 6;
  forbiddenTouches = 0;
  shakeTime = 0;
  flickerFrames = 0;
  watcherStunTimer = 0;
  flickerCooldown = 0;
  player.x = 50;
  player.y = 200;
  watcher.baseSpeed = 1.1;
  
  canvas.style.borderColor = "#333";
  canvas.style.boxShadow = "0 0 20px rgba(0,0,0,0.8)";

  forbiddenFruit.active = allBaseEndingsUnlocked();
  
  realmText.innerText = "REALM: EDEN'S GROVE";
  realmText.style.color = "#a8e6cf";
  scoreText.innerText = "FRUITS GATHERED: 0 / 20";
  scoreText.style.color = "#ffffff";
  
  loreBox.style.background = "#161a23";
  loreBox.style.borderLeft = "4px solid #558b2f";
  loreBox.style.color = "#e0e0e0";
  loreBox.innerText = forbiddenFruit.active
    ? "The three seals are remembered. A crimson fruit has fallen from the eastern tree..."
    : '"The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."';
  
  updateSigilHUD();
  spawnItem();
}

function checkCollision(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function drawTree(x, y, style = "round") {
  ctx.fillStyle = "#2e1c0c";
  ctx.fillRect(x + 16, y + 22, 13, 20);

  ctx.fillStyle = "#1b4d1b";
  if (style === "boxy") {
    ctx.fillRect(x + 5, y + 5, 35, 22);
  } else {
    ctx.beginPath();
    ctx.arc(x + 22.5, y + 16, 19, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateSanityBorder() {
  if (!isUpsideDown || gameOver) {
    if (!gameOver) {
      canvas.style.borderColor = "#333";
      canvas.style.boxShadow = "0 0 20px rgba(0,0,0,0.8)";
    }
    return;
  }

  const dist = Math.hypot(player.x - watcher.x, player.y - watcher.y);
  const proximity = Math.max(0, Math.min(1, 1 - (dist - 30) / 320));
  const pulseSpeed = 0.08 + proximity * 0.25;
  const pulse = (Math.sin(glitchTimer * pulseSpeed) + 1) / 2;

  const alpha = (0.15 + proximity * 0.75) * (0.6 + pulse * 0.4);
  const spread = Math.round(12 + proximity * 35 + pulse * 10);
  const red = Math.round(120 + proximity * 135);

  canvas.style.borderColor = `rgba(${red}, 15, 15, ${0.5 + proximity * 0.5})`;
  canvas.style.boxShadow = `0 0 ${spread}px rgba(${red}, 0, 0, ${alpha.toFixed(2)})`;
}

function update() {
  if (shakeTime > 0) shakeTime--;
  if (flickerFrames > 0) flickerFrames--;
  if (watcherStunTimer > 0) watcherStunTimer--;
  if (flickerCooldown > 0) flickerCooldown--;
  if (gameOver) return;

  // Rare, fairly random subliminal flicker with a cooldown after 8+ fruits
  if (!isUpsideDown && score >= 8 && flickerFrames === 0 && flickerCooldown === 0) {
    if (Math.random() < 0.0008) {
      flickerFrames = 2;       // Quick 2-frame flash
      flickerCooldown = 240;   // ~4 second cooldown before another can trigger
    }
  }

  let touchedAnomalyThisFrame = false;

  let nextX = player.x;
  if (keys["a"] || keys["arrowleft"]) nextX -= player.speed;
  if (keys["d"] || keys["arrowright"]) nextX += player.speed;
  nextX = Math.max(0, Math.min(canvas.width - player.size, nextX));
  
  let collidedX = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(nextX, player.y, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) {
        collidedX = true;
        break;
      }
    }
    if (checkCollision(nextX, player.y, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
      collidedX = true;
      touchedAnomalyThisFrame = true;
    }
  }
  if (!collidedX) {
    player.x = nextX;
  }

  let nextY = player.y;
  if (keys["w"] || keys["arrowup"]) nextY -= player.speed;
  if (keys["s"] || keys["arrowdown"]) nextY += player.speed;
  nextY = Math.max(0, Math.min(canvas.height - player.size, nextY));
  
  let collidedY = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(player.x, nextY, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) {
        collidedY = true;
        break;
      }
    }
    if (checkCollision(player.x, nextY, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
      collidedY = true;
      touchedAnomalyThisFrame = true;
    }
  }
  if (!collidedY) {
    player.y = nextY;
  }

  if (!isUpsideDown && touchedAnomalyThisFrame) {
    handleAnomalyTouch();
  }

  if (!isUpsideDown && forbiddenFruit.active) {
    if (checkCollision(player.x, player.y, player.size, player.size, forbiddenFruit.x, forbiddenFruit.y, forbiddenFruit.size, forbiddenFruit.size)) {
      forbiddenFruit.active = false;
      triggerUpsideDown(true);
      return;
    }
  }

  if (checkCollision(player.x, player.y, player.size, player.size, item.x, item.y, item.size, item.size)) {
    if (!isUpsideDown) {
      score++;
      scoreText.innerText = `FRUITS GATHERED: ${score} / 20`;
      if (score === 5) {
        loreBox.innerText = "Deep in the woods, the shadows grow long. Something feels different near the eastern edge.";
      } else if (score === 12) {
        loreBox.innerText = "You remain faithful to the harvest, ignoring the strange pull from the east.";
      }
      
      if (score >= 20) {
        gameOver = true;
        edenWon = true;
        saveEnding("eden");
        loreBox.innerText = "MATTHEW 25:21 — 'Well done, good and faithful servant. Enter into the joy of your master.'";
      } else {
        spawnItem();
      }
    } else {
      eyesCollected++;
      scoreText.innerText = `SEALS BROKEN: ${eyesCollected} / ${targetSeals}`;
      loreBox.innerText = abyssLore[Math.min(eyesCollected - 1, abyssLore.length - 1)];
      
      watcher.baseSpeed += isTrueAbyss ? 0.08 : 0.09;
      watcherStunTimer = 36; 
      shakeTime = 20;
      
      if (eyesCollected >= targetSeals) {
        gameOver = true;
        if (isTrueAbyss) {
          trueWon = true;
          saveEnding("trueEnd");
        } else {
          won = true;
          saveEnding("revelation");
        }
        shakeTime = 9999;
      } else {
        spawnItem();
      }
    }
  }

  if (isUpsideDown) {
    const dx = player.x - watcher.x;
    const dy = player.y - watcher.y;
    const dist = Math.hypot(dx, dy);

    if (dist > 0) {
      let dynamicSpeed = watcher.baseSpeed;
      if (dist > 220) {
        dynamicSpeed += 0.65;
      } else if (dist < 85) {
        dynamicSpeed -= 0.15;
      }

      const maxCap = isTrueAbyss ? 1.82 : 1.72;
      dynamicSpeed = Math.min(dynamicSpeed, maxCap);

      if (watcherStunTimer > 0) {
        dynamicSpeed *= 0.25;
      }

      watcher.x += (dx / dist) * dynamicSpeed;
      watcher.y += (dy / dist) * dynamicSpeed;
    }

    const pad = 4;
    if (checkCollision(
      player.x, player.y, player.size, player.size,
      watcher.x + pad, watcher.y + pad, watcher.size - pad * 2, watcher.size - pad * 2
    )) {
      gameOver = true;
      won = false;
      saveEnding("death");
      shakeTime = 9999;
    }
  }

  updateSanityBorder();
  glitchTimer++;
}

function drawWatcher(wx, wy, wsize) {
  ctx.save();
  ctx.translate(wx + wsize / 2, wy + wsize / 2);
  const rotSpeed = watcherStunTimer > 0 ? 0.015 : 0.05;
  ctx.rotate(glitchTimer * rotSpeed);
  
  ctx.strokeStyle = watcherStunTimer > 0 ? "#ff8a80" : "#ff1744";
  ctx.lineWidth = 2;
  ctx.strokeRect(-18, -18, 36, 36);
  ctx.rotate(Math.PI / 4);
  ctx.strokeRect(-18, -18, 36, 36);

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(0, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();

  if (shakeTime > 0) {
    const dx = (Math.random() - 0.5) * 14;
    const dy = (Math.random() - 0.5) * 14;
    ctx.translate(dx, dy);
  }

  if (!isUpsideDown) {
    const isFlickering = flickerFrames > 0;

    ctx.fillStyle = isFlickering ? "#140404" : "#558b2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = isFlickering ? "#ff1744" : "#fff59d";
    for (let i = 0; i < 10; i++) {
      ctx.fillRect((i * 59) % 580, (i * 83) % 380, 4, 4);
    }

    if (isFlickering) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(item.x + 7, item.y + 7, 10, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff0000";
      ctx.beginPath();
      ctx.arc(item.x + 7, item.y + 7, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(item.x + 7, item.y + 7, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    if (forbiddenFruit.active) {
      const glow = 5 + Math.sin(glitchTimer * 0.1) * 2;
      ctx.fillStyle = "rgba(255, 23, 68, 0.35)";
      ctx.beginPath();
      ctx.arc(forbiddenFruit.x + 7, forbiddenFruit.y + 7, glow + 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff1744";
      ctx.beginPath();
      ctx.arc(forbiddenFruit.x + 7, forbiddenFruit.y + 7, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    if (isFlickering) {
      drawWatcher(anomaly.x - 15, anomaly.y - 10, 28);
    }

    ctx.fillStyle = isFlickering ? "#b0bec5" : "#ffffff";
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.fillStyle = "#000000";
    ctx.fillRect(player.x + 12, player.y + 5, 3, 3);

    for (const tree of forestTrees) {
      drawTree(tree.x, tree.y, tree.style);
    }

    drawTree(anomaly.x, anomaly.y, anomaly.style);

  } else {
    ctx.fillStyle = isTrueAbyss ? "#050000" : "#090202";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = isTrueAbyss ? "#4a0000" : "#2a0808";
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 85, 0);
      ctx.lineTo(i * 85 + 15, 60);
      ctx.stroke();
    }

    if (glitchTimer % 10 < 2) {
      ctx.fillStyle = "rgba(255, 0, 0, 0.08)";
      ctx.fillRect(0, Math.random() * canvas.height, canvas.width, 4);
    }

    if (watcherStunTimer > 28) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(item.x + 7, item.y + 7, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(item.x + 7, item.y + 7, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#b0bec5";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    drawWatcher(watcher.x, watcher.y, watcher.size);

    const visionRadius = isTrueAbyss ? 175 : 210;
    const gradient = ctx.createRadialGradient(
      player.x + 10, player.y + 10, 35,
      player.x + 10, player.y + 10, visionRadius
    );
    gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
    gradient.addColorStop(1, "rgba(0, 0, 0, 0.95)");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (gameOver) {
    ctx.textAlign = "center";

    if (edenWon) {
      ctx.fillStyle = "rgba(255, 248, 220, 0.90)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#2e7d32";
      ctx.font = "bold 22px Courier New";
      ctx.fillText("THE OBEDIENT SHEPHERD", canvas.width / 2, 150);
      ctx.fillStyle = "#333333";
      ctx.font = "13px Courier New";
      ctx.fillText("You tended the grove in peace and resisted temptation.", canvas.width / 2, 185);
      ctx.fillStyle = "#666666";
      ctx.font = "12px Courier New";
      ctx.fillText("Press [R] to replay... but something feels off.", canvas.width / 2, 235);
    } else if (trueWon) {
      ctx.fillStyle = "rgba(15, 0, 0, 0.93)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff1744";
      ctx.font = "bold 24px Courier New";
      ctx.fillText("THE SEVENTH SEAL UNDONE", canvas.width / 2, 150);
      ctx.fillStyle = "#e0e0e0";
      ctx.font = "13px Courier New";
      ctx.fillText("Eden and Sheol are one. You inherited the throne of eyes.", canvas.width / 2, 185);
      ctx.fillStyle = "#888888";
      ctx.font = "12px Courier New";
      ctx.fillText("Press [R] to walk the garden once more.", canvas.width / 2, 235);
    } else if (won) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff5252";
      ctx.font = "bold 24px Courier New";
      ctx.fillText("BE NOT AFRAID.", canvas.width / 2, 160);
      ctx.fillStyle = "#cccccc";
      ctx.font = "14px Courier New";
      ctx.fillText("You gazed into the Abyss and survived the revelation.", canvas.width / 2, 195);
      ctx.fillText("Press [R] to return to the beginning.", canvas.width / 2, 240);
    } else {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff0000";
