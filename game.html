<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eden / Sheol / Pit — Lore & Whisper System</title>
  <style>
    :root {
      --bg: #0a0b0e;
      --panel: #11131a;
      --border: rgba(255, 255, 255, 0.12);
      --text: #e6e8ef;
      --muted: #98a0b3;
      --accent: #7be0ad;
      --danger: #ff6b6b;
      --pit: #c084fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 16px;
      padding: 16px;
    }

    .main-stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    canvas {
      width: 100%;
      height: 420px;
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
    }

    #lore-box {
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 56px;
    }

    #lore-box.alert {
      border-left-color: var(--danger);
      color: #ffd6d6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.06em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: #1a1e29;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #242938;
    }

    button.danger {
      border-color: rgba(255, 107, 107, 0.4);
      color: #ff9e9e;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
    }

    .whisper-notes {
      margin-top: 10px;
      padding: 8px 10px;
      border-left: 2px solid rgba(255, 82, 82, 0.45);
      background: rgba(15, 15, 20, 0.65);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .whisper-notes-title {
      font-size: 10px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }

    #whisper-notes-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .whisper-item {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #ff8a8a;
    }

    .whisper-empty {
      opacity: 0.55;
      font-style: italic;
    }

    .status-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="main-stage">
    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div id="lore-box">The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures...</div>

    <div class="controls">
      <button onclick="enterEden()">Return to Eden</button>
      <button onclick="triggerUpsideDown({ enterEmptySheol: false, allowPit: false })">Enter Sheol</button>
      <button onclick="triggerUpsideDown({ enterEmptySheol: false, allowPit: true })">Enter Bottomless Pit</button>
      <button onclick="triggerUpsideDown({ enterEmptySheol: true, allowPit: false })">Enter Empty Sheol</button>
      <button onclick="collectNextSigil()">Collect Sigil</button>
      <button onclick="addFruit(5)">+5 Fruit</button>
      <button onclick="toggleCrown()">Toggle Crown</button>
      <button onclick="moveWatcherCloser()">Lure Watcher Near</button>
      <button class="danger" onclick="triggerGameOver()">Simulate Death</button>
      <button class="danger" onclick="resetGame()">Full Reset</button>
    </div>
  </div>

  <aside class="sidebar">
    <div class="panel">
      <div class="panel-title">Status &amp; Badges</div>
      <div id="badges" class="badges"></div>

      <div id="whisper-notes" class="whisper-notes">
        <div class="whisper-notes-title">Recorded Whispers</div>
        <ul id="whisper-notes-list">
          <li class="whisper-empty">None heard yet...</li>
        </ul>
      </div>
    </div>

    <div class="panel status-meta" id="debug-meta"></div>
  </aside>

  <script>
    // ==========================================
    // 1. LORE POOLS & CIPHER CONSTANTS
    // ==========================================
    const EDEN_LORE = {
      default: "The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures...",
      crown: "You wear the Watcher's rings now. The grass beneath your feet withers at your presence.",
      crimsonFruit: "All three marks are remembered. Something red has dropped where it does not belong..."
    };

    const EDEN_MILESTONES = {
      score5Crown: "The golden fruits taste like static now. The grove recognizes its usurper.",
      score5Standard: "The pasture stays calm, though a few shadows linger longer than the rest.",
      score12Crown: "A quiet tremor runs through the bark as your rings pass—like a lock that almost turns.",
      score12Standard: "You remain faithful to the harvest, letting the rest of the grove keep its quiet.",
      score20Crown: "THE CROWNED HARVEST — 'Twenty fruits taken beneath crimson rings. Even a dying garden remembers its first seed.'",
      score20Standard: "MATTHEW 25:21 — 'Well done, good and faithful servant. Enter into the joy of your master.'"
    };

    const ANOMALY_TOUCH_LORE = [
      "The bark is cold to the touch—like winter had settled inside the grain alone.",
      "A drop of black sap leaks from the grain. Something feels wrong.",
      "You hear faint whispers echoing up through the roots... Turn back."
    ];

    const ENTRY_LORE = {
      emptySheol: "THE DARKNESS RECOGNIZES WHAT YOU WEAR. SOMETHING PALE STIRS IN THE QUIET.",
      pit: "YOU CONSUMED THE CORE OF KNOWLEDGE. THE ABYSS KNOWS YOUR NAME.",
      sheol: "YOU TOUCHED THE FORBIDDEN ROOT. THE SKY HAS ROLLED UP LIKE A SCROLL."
    };

    const SHEOL_SIGIL_LORE = [
      "GENESIS 3:24 — 'He drove out the man; and placed at the east of the garden Cherubims, and a flaming sword...'",
      "EZEKIEL 1:18 — 'As for their rings, they were so high that they were dreadful; and their rings were full of eyes round about them.'",
      "JOB 26:6 — 'Sheol is naked before Him, and Abaddon has no covering.'",
      "REVELATION 9:11 — 'They had as king over them the angel of the Abyss, whose name in Hebrew is Abaddon.'",
      "MATTHEW 8:12 — 'Thrown outside into the darkness, where there will be weeping and gnashing of teeth.'",
      "THE SIXTH SIGIL BREAKS. THE THRESHOLD OF SHEOL OPENS."
    ];

    // Sigils 1-8: Bible verses; Sigil 9: sets up the chase before catching the Watcher
    const PIT_SIGIL_LORE = [
      "PSALM 88:6 — 'You have put me in the lowest pit, in the darkest depths.'",
      "JOB 28:14 — 'The deep says, It is not in me; and the sea says, It is not with me.'",
      "PROVERBS 27:20 — 'Sheol and Abaddon are never satisfied, and never satisfied are the eyes of man.'",
      "PSALM 139:8 — 'If I ascend to heaven, you are there! If I make my bed in Sheol, you are there.'",
      "JONAH 2:2 — 'Out of the belly of Sheol I cried, and you heard my voice.'",
      "REVELATION 20:1 — 'Then I saw an angel coming down from heaven, holding in his hand the key to the bottomless pit and a great chain.'",
      "REVELATION 8:1 — 'When he opened the seventh seal, there was silence in heaven for about half an hour.'",
      "ISAIAH 14:15 — 'Yet you are brought down to Sheol, to the far reaches of the pit.'",
      "THE NINTH SIGIL BREAKS. IT FLEES INTO THE DARK—HUNT IT DOWN."
    ];

    const EVENT_LORE = {
      phantomSigil: "A MIRAGE OF THE PIT. YOUR EYES DECEIVE YOU.",
      roleReversal: "THE ROLES ARE REVERSED. HUNT IT DOWN BEFORE IT UNMAKES THE PIT.",
      finalCatch: "THE THRONE IS EMPTY. YOU HAVE BECOME THE WATCHER.",
      doorApproach: "Hold still at the edge. Another small thing has wandered in to gather what you left behind.",
      doorAfterHold: "You may keep walking into the dark, or run after what repeats you."
    };

    const EDEN_STILLNESS_WHISPERS = [
      "The grass grows quiet when you stop moving. Something beneath it is listening.",
      "Something is breathing beneath the soil.",
      "You are not alone in the pasture.",
      "Do not look too long at the shadows.",
      "He knows you are hesitating."
    ];

    // Caesar Shift +2 proximity whispers
    const WATCHER_PROXIMITY_WHISPERS = [
      "K UGG AQW",
      "VJG RKV KU YQTM",
      "EQOG ENQUGT",
      "AQW ECPPV JKFG",
      "VJG GAFG KU QPG"
    ];

    const CIPHER_HINTS = {
      stage1: "Two steps forward shifts what is spoken. Step back two to hear it plain.",
      stage2: "Look to the short words: step back two letters from each mark to read what watches you."
    };

    // ==========================================
    // 2. GAME & WHISPER CODEX STATE
    // ==========================================
    const WHISPER_RADIUS = 200;
    const KILL_RADIUS = 30;
    const PROXIMITY_COOLDOWN_MS = 4500;
    const IDLE_WHISPER_MS = 10000;

    let isUpsideDown = false;
    let emptySheol = false;
    let allowPit = false;
    let doorCinematicActive = false;
    let doorCinematicTimer = 3.0;
    let gameOver = false;
    let crownEquipped = false;
    let crimsonFruitActive = false;
    let score = 0;
    let sigilCount = 0;
    let anomalyTouches = 0;
    let watcherHuntingPlayer = false;
    let watcherFleeing = false;

    const player = { x: 200, y: 210, speed: 180, lastMoveTime: performance.now() };
    const watcher = { x: 560, y: 210, speed: 125 };

    // Persists across deaths; cleared ONLY on resetGame()
    const recordedWhispers = new Set();
    let lastProximityWhisperTime = 0;
    let lastStillnessWhisperTime = 0;
    let whisperCount = 0;
    let cipherHintStage = 0;
    let clueTimeoutId = null;

    const keys = new Set();

    // ==========================================
    // 3. LORE & CODEX HELPERS
    // ==========================================
    function hasCrownEquipped() {
      return crownEquipped;
    }

    function setLoreBox(text, { alertStyle = false } = {}) {
      const box = document.getElementById("lore-box");
      if (!box) return;
      box.textContent = text;
      box.classList.toggle("alert", Boolean(alertStyle));
    }

    function getSigilLore(count, isTrueAbyss) {
      const pool = isTrueAbyss ? PIT_SIGIL_LORE : SHEOL_SIGIL_LORE;
      const index = Math.max(0, Math.min(count - 1, pool.length - 1));
      return pool[index];
    }

    function renderWhisperNotes() {
      const list = document.getElementById("whisper-notes-list");
      if (!list) return;

      list.innerHTML = "";

      if (recordedWhispers.size === 0) {
        const empty = document.createElement("li");
        empty.className = "whisper-empty";
        empty.textContent = "None heard yet...";
        list.appendChild(empty);
        return;
      }

      recordedWhispers.forEach((line) => {
        const item = document.createElement("li");
        item.className = "whisper-item";
        item.textContent = line;
        list.appendChild(item);
      });
    }

    function recordWatcherWhisper(line) {
      if (!line) return;
      const isNew = !recordedWhispers.has(line);
      recordedWhispers.add(line);
      if (isNew) {
        renderWhisperNotes();
      }
    }

    function scheduleCipherHint() {
      if (clueTimeoutId) {
        clearTimeout(clueTimeoutId);
        clueTimeoutId = null;
      }

      const nextStage = whisperCount >= 3 ? 2 : whisperCount >= 1 ? 1 : 0;
      if (nextStage <= cipherHintStage) return;

      clueTimeoutId = setTimeout(() => {
        if (!isUpsideDown || emptySheol || gameOver) return;
        setLoreBox(CIPHER_HINTS[`stage${nextStage}`], { alertStyle: false });
        cipherHintStage = nextStage;
      }, 4000);
    }

    function triggerProximityWhisper(now = performance.now()) {
      if (now - lastProximityWhisperTime < PROXIMITY_COOLDOWN_MS) return;

      const line =
        WATCHER_PROXIMITY_WHISPERS[
          Math.floor(Math.random() * WATCHER_PROXIMITY_WHISPERS.length)
        ];

      setLoreBox(line, { alertStyle: true });
      recordWatcherWhisper(line);
      whisperCount += 1;
      lastProximityWhisperTime = now;
      scheduleCipherHint();
    }

    function updateWatcherProximityLore(now = performance.now()) {
      if (!isUpsideDown || emptySheol || doorCinematicActive || gameOver) return;

      const dist = Math.hypot(watcher.x - player.x, watcher.y - player.y);

      if (!watcherFleeing && dist <= KILL_RADIUS) {
        triggerGameOver();
        return;
      }

      if (watcherFleeing && dist <= KILL_RADIUS + 10) {
        watcherFleeing = false;
        setLoreBox(EVENT_LORE.finalCatch, { alertStyle: false });
        return;
      }

      if (!watcherFleeing && dist <= WHISPER_RADIUS) {
        triggerProximityWhisper(now);
      }
    }

    function updateEdenStillnessLore(now = performance.now()) {
      if (isUpsideDown || gameOver) return;
      const movedRecently = now - player.lastMoveTime < IDLE_WHISPER_MS;
      const cooldownPassed = now - lastStillnessWhisperTime >= IDLE_WHISPER_MS;

      if (!movedRecently && cooldownPassed) {
        const line =
          EDEN_STILLNESS_WHISPERS[
            Math.floor(Math.random() * EDEN_STILLNESS_WHISPERS.length)
          ];
        setLoreBox(line, { alertStyle: false });
        lastStillnessWhisperTime = now;
      }
    }

    function updateEmptySheolCinematic(dt) {
      if (!isUpsideDown || !emptySheol || gameOver) return;
      const door = { x: 720, y: 210 };
      const distToDoor = Math.hypot(door.x - player.x, door.y - player.y);

      if (distToDoor < 90 && doorCinematicTimer > 0) {
        doorCinematicActive = true;
        setLoreBox(EVENT_LORE.doorApproach, { alertStyle: false });
        doorCinematicTimer -= dt;
        if (doorCinematicTimer <= 0) {
          doorCinematicActive = false;
          setLoreBox(EVENT_LORE.doorAfterHold, { alertStyle: false });
        }
      }
    }

    // ==========================================
    // 4. STATE TRANSITIONS, DEATH & RESET
    // ==========================================
    function enterEden() {
      isUpsideDown = false;
      emptySheol = false;
      allowPit = false;
      doorCinematicActive = false;
      watcherFleeing = false;
      gameOver = false;
      player.x = 200;
      player.y = 210;
      watcher.x = 560;
      watcher.y = 210;

      if (hasCrownEquipped()) {
        setLoreBox(EDEN_LORE.crown);
      } else if (crimsonFruitActive) {
        setLoreBox(EDEN_LORE.crimsonFruit);
      } else {
        setLoreBox(EDEN_LORE.default);
      }
      renderHUD();
    }

    function triggerUpsideDown({ enterEmptySheol = false, allowPit: pitMode = false } = {}) {
      isUpsideDown = true;
      emptySheol = Boolean(enterEmptySheol);
      allowPit = Boolean(pitMode);
      doorCinematicActive = false;
      doorCinematicTimer = 3.0;
      watcherFleeing = false;
      gameOver = false;
      sigilCount = 0;
      player.x = 160;
      player.y = 210;
      watcher.x = 420;
      watcher.y = 210;

      if (emptySheol) {
        setLoreBox(ENTRY_LORE.emptySheol, { alertStyle: true });
      } else if (allowPit) {
        setLoreBox(ENTRY_LORE.pit, { alertStyle: true });
      } else {
        setLoreBox(ENTRY_LORE.sheol, { alertStyle: true });
      }
      renderHUD();
    }

    function collectNextSigil() {
      if (!isUpsideDown || emptySheol || gameOver) return;
      const maxSigils = allowPit ? 9 : 6;
      sigilCount = Math.min(maxSigils, sigilCount + 1);
      const loreText = getSigilLore(sigilCount, allowPit);
      setLoreBox(loreText, { alertStyle: true });

      if (allowPit && sigilCount === 9) {
        watcherFleeing = true;
        watcher.x = 690;
        watcher.y = 110;
      }
      renderHUD();
    }

    function addFruit(amount) {
      score += amount;
      if (isUpsideDown) return;

      if (score >= 20) {
        setLoreBox(hasCrownEquipped() ? EDEN_MILESTONES.score20Crown : EDEN_MILESTONES.score20Standard);
      } else if (score >= 12) {
        setLoreBox(hasCrownEquipped() ? EDEN_MILESTONES.score12Crown : EDEN_MILESTONES.score12Standard);
      } else if (score >= 5) {
        setLoreBox(hasCrownEquipped() ? EDEN_MILESTONES.score5Crown : EDEN_MILESTONES.score5Standard);
      }
      renderHUD();
    }

    function toggleCrown() {
      crownEquipped = !crownEquipped;
      if (!isUpsideDown) {
        setLoreBox(crownEquipped ? EDEN_LORE.crown : EDEN_LORE.default);
      }
      renderHUD();
    }

    function moveWatcherCloser() {
      if (!isUpsideDown || emptySheol) return;
      watcher.x = Math.min(760, player.x + 120);
      watcher.y = player.y;
      renderHUD();
    }

    // Preserves recordedWhispers across deaths
    function handlePlayerDeath() {
      if (clueTimeoutId) {
        clearTimeout(clueTimeoutId);
        clueTimeoutId = null;
      }
      gameOver = true;
      doorCinematicActive = false;
      setLoreBox("THE DARKNESS CLAIMS YOU. YOUR NOTES REMAIN.", { alertStyle: true });
      renderWhisperNotes();
      renderHUD();
    }

    function triggerGameOver() {
      handlePlayerDeath();
    }

    // Wipes recordedWhispers only on a full game reset
    function resetGame() {
      if (clueTimeoutId) {
        clearTimeout(clueTimeoutId);
        clueTimeoutId = null;
      }
      recordedWhispers.clear();
      lastProximityWhisperTime = 0;
      lastStillnessWhisperTime = 0;
      whisperCount = 0;
      cipherHintStage = 0;
      score = 0;
      sigilCount = 0;
      anomalyTouches = 0;
      crownEquipped = false;
      crimsonFruitActive = false;
      watcherFleeing = false;
      enterEden();
      renderWhisperNotes();
    }

    // ==========================================
    // 5. INPUT, LOOP & RENDERING
    // ==========================================
    window.addEventListener("keydown", (e) => {
      keys.add(e.key.toLowerCase());
      player.lastMoveTime = performance.now();
    });
    window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function updateSimulation(dt, now) {
      if (gameOver) return;

      let dx = 0;
      let dy = 0;
      if (keys.has("w") || keys.has("arrowup")) dy -= 1;
      if (keys.has("s") || keys.has("arrowdown")) dy += 1;
      if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
      if (keys.has("d") || keys.has("arrowright")) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        player.x = Math.max(20, Math.min(canvas.width - 20, player.x + (dx / len) * player.speed * dt));
        player.y = Math.max(20, Math.min(canvas.height - 20, player.y + (dy / len) * player.speed * dt));
        player.lastMoveTime = now;
      }

      if (isUpsideDown && !emptySheol && !doorCinematicActive) {
        const toPlayerX = player.x - watcher.x;
        const toPlayerY = player.y - watcher.y;
        const dist = Math.hypot(toPlayerX, toPlayerY) || 1;

        if (watcherFleeing) {
          watcher.x = Math.max(30, Math.min(canvas.width - 30, watcher.x - (toPlayerX / dist) * (watcher.speed * 0.9) * dt));
          watcher.y = Math.max(30, Math.min(canvas.height - 30, watcher.y - (toPlayerY / dist) * (watcher.speed * 0.9) * dt));
        } else {
          watcher.x += (toPlayerX / dist) * watcher.speed * dt;
          watcher.y += (toPlayerY / dist) * watcher.speed * dt;
        }
      }

      updateEmptySheolCinematic(dt);
      updateWatcherProximityLore(now);
      updateEdenStillnessLore(now);
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!isUpsideDown) {
        ctx.fillStyle = "#0e1d15";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (allowPit) {
        ctx.fillStyle = "#140b1e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#180c0e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (isUpsideDown && !emptySheol) {
        // Whisper warning radius
        ctx.beginPath();
        ctx.arc(watcher.x, watcher.y, WHISPER_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 107, 107, 0.25)";
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Kill radius
        ctx.beginPath();
        ctx.arc(watcher.x, watcher.y, KILL_RADIUS, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 107, 107, 0.75)";
        ctx.stroke();

        // Watcher
        ctx.beginPath();
        ctx.arc(watcher.x, watcher.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = watcherFleeing ? "#c084fc" : "#ff4d4d";
        ctx.fill();
      }

      // Player
      ctx.beginPath();
      ctx.arc(player.x, player.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#7be0ad";
      ctx.fill();
    }

    function renderHUD() {
      const realm = !isUpsideDown ? "Eden" : emptySheol ? "Empty Sheol" : allowPit ? "Bottomless Pit" : "Sheol";
      const maxSigils = allowPit ? 9 : 6;
      const badgesEl = document.getElementById("badges");
      badgesEl.innerHTML = `
        <span class="badge">Realm: ${realm}</span>
        <span class="badge">Fruit: ${score}</span>
        <span class="badge">Sigils: ${sigilCount}/${maxSigils}</span>
        <span class="badge">Crown: ${crownEquipped ? "On" : "Off"}</span>
      `;

      const dist = Math.hypot(watcher.x - player.x, watcher.y - player.y).toFixed(0);
      document.getElementById("debug-meta").innerHTML = `
        <div><strong>WASD / Arrows:</strong> Move player</div>
        <div><strong>Watcher Dist:</strong> ${isUpsideDown && !emptySheol ? `${dist}px (Whisper ≤ ${WHISPER_RADIUS}px, Kill ≤ ${KILL_RADIUS}px)` : "N/A"}</div>
        <div><strong>Whispers Logged:</strong> ${recordedWhispers.size} / ${WATCHER_PROXIMITY_WHISPERS.length}</div>
        <div><strong>Hint Stage:</strong> ${cipherHintStage} / 2</div>
      `;
    }

    let lastFrameTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      updateSimulation(dt, now);
      drawScene();
      renderHUD();

      requestAnimationFrame(gameLoop);
    }

    // Initial render
    renderWhisperNotes();
    renderHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
