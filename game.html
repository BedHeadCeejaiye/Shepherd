<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0e1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    color: white;
    user-select: none;
  }
  #game-layout {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  #game-wrapper {
    position: relative;
    width: 600px;
    height: 400px;
  }
  canvas {
    border: 2px solid #333;
    border-radius: 4px;
    background-color: #558b2f;
    outline: none;
    display: block;
  }
  #hud {
    width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
  }
  #sigils {
    letter-spacing: 2px;
    font-size: 11px;
    color: #555;
  }
  /* Minimal Right-Side Volume Dock */
  #volume-dock {
    background: #161a23;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 380px;
    box-sizing: border-box;
    justify-content: space-between;
  }
  .volume-label {
    font-size: 9px;
    color: #a8e6cf;
    writing-mode: vertical-rl;
    letter-spacing: 1px;
  }
  .slider-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
  }
  #volume-slider {
    writing-mode: bt-lr;
    -webkit-appearance: slider-vertical;
    width: 6px;
    height: 240px;
    cursor: pointer;
    accent-color: #a8e6cf;
  }
  #lore-box {
    width: 580px;
    min-height: 40px;
    margin-top: 8px;
    padding: 8px;
    background: #161a23;
    border-left: 3px solid #558b2f;
    font-size: 13px;
    line-height: 1.3;
  }
  #console-overlay {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 560px;
    height: 240px;
    background: rgba(10, 13, 18, 0.95);
    border: 2px solid #ff1744;
    display: none;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
    z-index: 100;
  }
  #console-log {
    flex-grow: 1;
    overflow-y: auto;
    font-size: 11px;
    color: #a8e6cf;
    margin-bottom: 6px;
    white-space: pre-wrap;
  }
  #console-input-line {
    display: flex;
    align-items: center;
    border-top: 1px solid #333;
    padding-top: 4px;
  }
  #console-prompt {
    color: #ff1744;
    font-weight: bold;
    margin-right: 6px;
  }
  #console-input {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px;
    outline: none;
  }
</style>
</head>
<body>

<div id="hud">
  <span id="score-text">FRUITS GATHERED: 0 / 20</span>
  <span id="sigils">[---] [---] [---]</span>
  <span id="realm-text" style="color: #a8e6cf;">REALM: EDEN'S GROVE</span>
</div>

<div id="game-layout">
  <div id="game-wrapper">
    <canvas id="gameCanvas" width="600" height="400" tabindex="0"></canvas>
    <div id="console-overlay">
      <div id="console-log">SYS_CONSOLE v2.1 [EDEN_ABYSS KERNEL]
Type 'help' for commands. Press [F1] to close.
--------------------------------------------------</div>
      <div id="console-input-line">
        <span id="console-prompt">&gt;</span>
        <input type="text" id="console-input" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <div id="volume-dock" title="Volume">
    <span class="volume-label">VOL</span>
    <div class="slider-container">
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5">
    </div>
    <span style="font-size: 8px; color: #555;">▪</span>
  </div>
</div>

<div id="lore-box">
  "The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score-text");
const realmText = document.getElementById("realm-text");
const loreBox = document.getElementById("lore-box");
const sigilsText = document.getElementById("sigils");
const volumeSlider = document.getElementById("volume-slider");

const consoleOverlay = document.getElementById("console-overlay");
const consoleLog = document.getElementById("console-log");
const consoleInput = document.getElementById("console-input");

let consoleOpen = false;
let godMode = false;

let audioCtx = null;
let masterGain = null;
let abyssOsc1 = null;
let abyssOsc2 = null;
let abyssDroneGain = null;
let brookGain = null;
let nextBirdTime = 0;
let lastHeartbeatTime = 0;

function initAudioEngine() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);

    const bufferSize = audioCtx.sampleRate * 3;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      output[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = output[i];
      output[i] *= 1.8;
    }

    const whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;
    whiteNoise.loop = true;

    const brookFilter = audioCtx.createBiquadFilter();
    brookFilter.type = "bandpass";
    brookFilter.frequency.setValueAtTime(420, audioCtx.currentTime);
    brookFilter.Q.setValueAtTime(0.7, audioCtx.currentTime);

    brookGain = audioCtx.createGain();
    brookGain.gain.setValueAtTime(0.08, audioCtx.currentTime);

    whiteNoise.connect(brookFilter);
    brookFilter.connect(brookGain);
    brookGain.connect(masterGain);
    whiteNoise.start(0);

    abyssDroneGain = audioCtx.createGain();
    abyssDroneGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
    abyssDroneGain.connect(masterGain);

    abyssOsc1 = audioCtx.createOscillator();
    abyssOsc1.type = "triangle";
    abyssOsc1.frequency.setValueAtTime(65.41, audioCtx.currentTime);
    const g1 = audioCtx.createGain();
    g1.gain.setValueAtTime(0.14, audioCtx.currentTime);
    abyssOsc1.connect(g1);
    g1.connect(abyssDroneGain);
    abyssOsc1.start();

    abyssOsc2 = audioCtx.createOscillator();
    abyssOsc2.type = "sawtooth";
    abyssOsc2.frequency.setValueAtTime(73.42, audioCtx.currentTime);
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.07, audioCtx.currentTime);
    abyssOsc2.connect(g2);
    g2.connect(abyssDroneGain);
    abyssOsc2.start();

    nextBirdTime = performance.now() + 1200;
  } catch (e) {}
}

function unlockAudio() {
  if (!audioCtx) initAudioEngine();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

volumeSlider.addEventListener("input", (e) => {
  unlockAudio();
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(parseFloat(e.target.value), audioCtx.currentTime);
  }
});

function playBirdChirp() {
  if (!audioCtx || audioCtx.state !== "running" || isUpsideDown || gameOver) return;
  try {
    const now = audioCtx.currentTime;
    const notesCount = Math.random() < 0.45 ? 2 : 1;
    const baseFreq = 2200 + Math.random() * 1100;

    for (let n = 0; n < notesCount; n++) {
      const start = now + n * 0.14;
      const dur = 0.09 + Math.random() * 0.05;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(baseFreq, start);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.28, start + dur * 0.6);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, start + dur);

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(0.045, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(start);
      osc.stop(start + dur + 0.01);
    }
  } catch (e) {}
}

function playFlickerSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.14);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(1800, now);
    filter.Q.setValueAtTime(1.5, now);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.28, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(masterGain);
    noise.start(now);

    const sub = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    sub.type = "sawtooth";
    sub.frequency.setValueAtTime(95, now);
    sub.frequency.exponentialRampToValueAtTime(32, now + 0.15);

    subGain.gain.setValueAtTime(0.25, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

    sub.connect(subGain);
    subGain.connect(masterGain);
    sub.start(now);
    sub.stop(now + 0.16);
  } catch (e) {}
}

function updateAmbientSoundscape(proximity, isAbyss, isPit) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;

  if (!isAbyss) {
    brookGain.gain.setTargetAtTime(0.08, now, 0.4);
    abyssDroneGain.gain.setTargetAtTime(0.0, now, 0.2);
    const perfNow = performance.now();
    if (perfNow >= nextBirdTime) {
      playBirdChirp();
      nextBirdTime = perfNow + 2200 + Math.random() * 3800;
    }
  } else if (!isPit) {
    brookGain.gain.setTargetAtTime(0.0, now, 0.2);
    abyssDroneGain.gain.setTargetAtTime(1.0, now, 0.4);
    abyssOsc1.frequency.setTargetAtTime(65.41 - (proximity * 15), now, 0.5);
    abyssOsc2.frequency.setTargetAtTime(73.42 + (proximity * 25), now, 0.5);
  } else {
    brookGain.gain.setTargetAtTime(0.0, now, 0.2);
    abyssDroneGain.gain.setTargetAtTime(1.15, now, 0.3);
    abyssOsc1.frequency.setTargetAtTime(55.00 + (proximity * 40), now, 0.2);
    abyssOsc2.frequency.setTargetAtTime(82.41 + (proximity * 50), now, 0.2);
  }
}

function playEdenCollectSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + i * 0.05);
      gain.gain.setValueAtTime(0.12, now + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now + i * 0.05);
      osc.stop(now + 0.25);
    });
  } catch (e) {}
}

function playAbyssCollectSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.4);
  } catch (e) {}
}

function playPitCollectSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.setValueAtTime(140, now + 0.08);
    osc.frequency.setValueAtTime(450, now + 0.16);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.3);
  } catch (e) {}
}

function playDeathSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(40, now + 0.5);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.6);
  } catch (e) {}
}

function playTrueEndingSound() {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    [261.63, 329.63, 392.00, 523.25].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now + i * 0.1);
      gain.gain.setValueAtTime(0.12, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(now + i * 0.1);
      osc.stop(now + 2.5);
    });
  } catch (e) {}
}

function triggerThump(startTime, freqStart, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freqStart, startTime);
  osc.frequency.exponentialRampToValueAtTime(28, startTime + 0.16);
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.18);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + 0.19);
}

function playHeartbeat(intensity = 1.0) {
  try {
    unlockAudio();
    const now = audioCtx.currentTime;
    triggerThump(now, 85 * intensity, 0.75);
    triggerThump(now + 0.14, 65 * intensity, 0.55);
  } catch (e) {}
}

canvas.focus();
canvas.addEventListener("click", () => {
  unlockAudio();
  if (!consoleOpen) canvas.focus();
});

let unlocked = JSON.parse(localStorage.getItem("eden_abyss_endings")) || {
  eden: false, death: false, revelation: false, trueEnd: false
};

function saveEnding(key) {
  unlocked[key] = true;
  localStorage.setItem("eden_abyss_endings", JSON.stringify(unlocked));
  updateSigilHUD();
}

function allBaseEndingsUnlocked() {
  return unlocked.eden && unlocked.death && unlocked.revelation;
}

function updateSigilHUD() {
  const s1 = unlocked.eden ? "<span style='color:#a8e6cf'>[LEAF]</span>" : "[----]";
  const s2 = unlocked.death ? "<span style='color:#ff5252'>[VOID]</span>" : "[----]";
  const s3 = unlocked.revelation ? "<span style='color:#ffd700'>[EYE]</span>" : "[---]";
  const s4 = unlocked.trueEnd ? " <span style='color:#ff1744'>[CROWN]</span>" : "";
  sigilsText.innerHTML = `${s1} ${s2} ${s3}${s4}`;
}

let isUpsideDown = false;
let isTrueAbyss = false;
let gameOver = false;
let won = false;
let edenWon = false;
let trueWon = false;
let score = 0;
let eyesCollected = 0;
let targetSeals = 6;
let forbiddenTouches = 0;
let shakeTime = 0;
let glitchTimer = 0;
let flickerFrames = 0;
let watcherStunTimer = 0;
let flickerCooldown = 0;
let hasFlickeredBefore = false;
let isWatcherFleeing = false;
let fleeGraceTimer = 0;
let watcherJukeTimer = 0;
let watcherJukeOffset = 1.0;
let watcherTrail = [];
let subliminalGlyphs = [];

let playerStillTimer = performance.now();
let lastPlayerX = 50;
let lastPlayerY = 200;
let isWhispering = false;
let savedLoreText = '"The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."';
let phantomItem = { x: 0, y: 0, active: false, timer: 0 };

const player = { x: 50, y: 200, size: 20, speed: 360 };
let item = { x: 300, y: 200, size: 14 };
const forbiddenFruit = { x: 495, y: 205, size: 14, active: false };

function checkForbiddenFruitSpawn() {
  unlocked = JSON.parse(localStorage.getItem("eden_abyss_endings")) || unlocked;
  forbiddenFruit.active = allBaseEndingsUnlocked();
  if (forbiddenFruit.active && !isUpsideDown && !gameOver) {
    setLore("The three seals are remembered. A crimson fruit has fallen from the eastern tree...");

}

const forestTrees = [
  { x: 60, y: 50, width: 45, height: 45, style: "round" },
  { x: 180, y: 40, width: 45, height: 45, style: "boxy" },
  { x: 310, y: 70, width: 45, height: 45, style: "round" },

];

const anomaly = { x: 520, y: 190, width: 45, height: 45, style: "round" };
const watcher = { x: 550, y: 50, size: 28, baseSpeed: 330 };

const abyssLore = [
  "GENESIS 3:24 — 'He drove out the man; and placed at the east of the garden Cherubims...'",

  "Why do you stand so still? The eastern tree is watching.",
  "Something is breathing beneath the soil.",
  "You are not alone in the pasture.",
  "Do not look too long at the shadows.",
  "He knows you are hesitating."
];

function setLore(text) {
  savedLoreText = text;
  if (!isWhispering) loreBox.innerText = text;
}

function logToConsole(text) {
  consoleLog.innerText += "\n" + text;
  consoleLog.scrollTop = consoleLog.scrollHeight;
}

function processCommand(cmd) {
  const parts = cmd.trim().toLowerCase().split(" ");
  const baseCmd = parts[0];
  logToConsole(`> ${cmd.trim()}`);

  if (baseCmd === "help") {
    logToConsole("COMMANDS: reset, abyss, trueabyss, flee, unlockall, godmode, speed <val>, teleport, clear");
  } else if (baseCmd === "reset") {
    localStorage.removeItem("eden_abyss_endings");
    unlocked = { eden: false, death: false, revelation: false, trueEnd: false };
    updateSigilHUD();
    resetGame();
    logToConsole("[SYS]: All endings purged.");
  } else if (baseCmd === "abyss") {
    triggerUpsideDown(false);
    toggleConsole();
  } else if (baseCmd === "trueabyss" || baseCmd === "flee") {
    triggerUpsideDown(true);
    if (baseCmd === "flee") {
      isWatcherFleeing = true;
      fleeGraceTimer = 0.2;
      watcher.baseSpeed = 240;
      scoreText.innerText = "CONSUME THE WATCHER";
      setLore("THE ROLES ARE REVERSED. HUNT IT DOWN.");
    }
    toggleConsole();
  } else if (baseCmd === "unlockall") {
    unlocked = { eden: true, death: true, revelation: true, trueEnd: true };
    localStorage.setItem("eden_abyss_endings", JSON.stringify(unlocked));
    updateSigilHUD();
    checkForbiddenFruitSpawn();
    logToConsole("[SYS]: All endings unlocked.");
  } else if (baseCmd === "godmode") {
    godMode = !godMode;
    logToConsole(`[SYS]: Godmode: ${godMode}`);
  } else if (baseCmd === "speed") {
    const val = parseFloat(parts[1]);
    if (!isNaN(val)) player.speed = val;
  } else if (baseCmd === "teleport") {
    player.x = 40 + Math.random() * 400;
    player.y = 40 + Math.random() * 300;
    toggleConsole();
  } else if (baseCmd === "clear") {
    consoleLog.innerText = "SYS_CONSOLE v2.1";
  }
  consoleInput.value = "";
}

function toggleConsole() {
  consoleOpen = !consoleOpen;
  consoleOverlay.style.display = consoleOpen ? "flex" : "none";
  if (!consoleOpen) canvas.focus();
  else consoleInput.focus();
}

consoleInput.addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "Enter") processCommand(consoleInput.value);
  else if (e.key === "F1") { e.preventDefault(); toggleConsole(); }
});

const keys = {};
window.addEventListener("keydown", (e) => {
  unlockAudio();
  if (e.key === "F1") { e.preventDefault(); toggleConsole(); return; }
  if (consoleOpen) return;
  keys[e.key.toLowerCase()] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
  if (gameOver && e.key.toLowerCase() === "r") resetGame();
});

window.addEventListener("keyup", (e) => {
  if (consoleOpen) return;
  keys[e.key.toLowerCase()] = false;
});

function spawnItem() {
  let valid = false;
  while (!valid) {
    item.x = 40 + Math.random() * (canvas.width - 120);
    item.y = 40 + Math.random() * (canvas.height - 80);
    valid = true;
    if (!isUpsideDown) {
      for (const tree of forestTrees) {
        if (checkCollision(item.x, item.y, item.size, item.size, tree.x, tree.y, tree.width, tree.height)) { valid = false; break; }
      }
      if (checkCollision(item.x, item.y, item.size, item.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) valid = false;
    } else {
      if (Math.hypot(item.x - watcher.x, item.y - watcher.y) < 90) valid = false;
    }
  }
}

function spawnPhantomItem() {
  phantomItem.x = 50 + Math.random() * (canvas.width - 120);
  phantomItem.y = 50 + Math.random() * (canvas.height - 100);
  phantomItem.active = true;
  phantomItem.timer = 320;
}

function triggerUpsideDown(trueMode = false) {
  isUpsideDown = true;
  isTrueAbyss = trueMode;
  targetSeals = trueMode ? 9 : 6;
  shakeTime = trueMode ? 70 : 45;
  watcherStunTimer = 45;
  score = 0;
  eyesCollected = 0;
  playerStillTimer = performance.now();
  isWhispering = false;
  isWatcherFleeing = false;
  fleeGraceTimer = 0;
  watcherJukeTimer = 0;
  watcherTrail = [];
  subliminalGlyphs = [];
  phantomItem.active = false;
  player.x = 60; player.y = 200;
  watcher.x = 540; watcher.y = 200;
  watcher.baseSpeed = trueMode ? 350 : 330;
  
  realmText.innerText = trueMode ? "REALM: THE BOTTOMLESS PIT" : "REALM: SHEOL // THE ABYSS";
  realmText.style.color = "#ff2a2a";
  scoreText.innerText = `SEALS BROKEN: 0 / ${targetSeals}`;
  scoreText.style.color = "#ff2a2a";
  
  loreBox.style.background = "#1a0505";
  loreBox.style.borderLeft = "3px solid #ff0000";
  loreBox.style.color = "#ff9999";
  setLore(trueMode ? "YOU CONSUMED THE CORE OF KNOWLEDGE." : "YOU TOUCHED THE FORBIDDEN ROOT.");
  spawnItem();
}

function handleAnomalyTouch() {
  forbiddenTouches++;
  shakeTime = 12;
  const dx = (player.x + 10) - (anomaly.x + 22.5);
  const dy = (player.y + 10) - (anomaly.y + 22.5);
  const dist = Math.hypot(dx, dy) || 1;
  player.x += (dx / dist) * 24;
  player.y += (dy / dist) * 24;
  if (forbiddenTouches >= 4) triggerUpsideDown(false);
}

function resetGame() {
  isUpsideDown = false;
  isTrueAbyss = false;
  gameOver = false;
  won = false;
  edenWon = false;
  trueWon = false;
  score = 0;
  eyesCollected = 0;
  targetSeals = 6;
  forbiddenTouches = 0;
  shakeTime = 0;
  flickerFrames = 0;
  watcherStunTimer = 0;
  flickerCooldown = 0;
  hasFlickeredBefore = false;
  isWatcherFleeing = false;
  fleeGraceTimer = 0;
  watcherTrail = [];
  subliminalGlyphs = [];
  playerStillTimer = performance.now();
  isWhispering = false;
  phantomItem.active = false;
  player.x = 50; player.y = 200;
  watcher.baseSpeed = 330;
  
  canvas.style.borderColor = "#333";
  canvas.style.boxShadow = "none";
  checkForbiddenFruitSpawn();
  
  realmText.innerText = "REALM: EDEN'S GROVE";
  realmText.style.color = "#a8e6cf";
  scoreText.innerText = "FRUITS GATHERED: 0 / 20";
  scoreText.style.color = "#ffffff";
  
  loreBox.style.background = "#161a23";
  loreBox.style.borderLeft = "3px solid #558b2f";
  loreBox.style.color = "#e0e0e0";
  if (!forbiddenFruit.active) setLore('"The Lord is my shepherd; I shall not want..."');
  updateSigilHUD();
  spawnItem();
}

function checkCollision(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function drawTree(x, y, style = "round") {
  ctx.fillStyle = "#2e1c0c";
  ctx.fillRect(x + 16, y + 22, 13, 20);
  ctx.fillStyle = "#1b4d1b";
  if (style === "boxy") ctx.fillRect(x + 5, y + 5, 35, 22);
  else {
    ctx.beginPath();
    ctx.arc(x + 22.5, y + 16, 19, 0, Math.PI * 2);
    ctx.fill();
  }
}

function updateSanityBorder() {
  if (!isUpsideDown || gameOver) {
    if (!gameOver) { canvas.style.borderColor = "#333"; canvas.style.boxShadow = "none"; }
    return;
  }
  const dist = Math.hypot(player.x - watcher.x, player.y - watcher.y);
  const proximity = Math.max(0, Math.min(1, 1 - (dist - 30) / 320));
  updateAmbientSoundscape(proximity, isUpsideDown, isTrueAbyss);

  if (isWatcherFleeing && performance.now() - lastHeartbeatTime > 520) {
    playHeartbeat(1.1);
    lastHeartbeatTime = performance.now();
  }
  canvas.style.borderColor = `rgba(200, 20, 20, ${0.4 + proximity * 0.6})`;
}

function update(dt) {
  if (consoleOpen) return;
  if (!isUpsideDown) updateAmbientSoundscape(0, false, false);

  if (shakeTime > 0) shakeTime -= dt * 60;
  if (flickerFrames > 0) flickerFrames -= dt * 60;
  if (watcherStunTimer > 0) watcherStunTimer -= dt * 60;
  if (flickerCooldown > 0) flickerCooldown -= dt * 60;
  if (fleeGraceTimer > 0) fleeGraceTimer -= dt;
  if (gameOver) return;

  if (isUpsideDown && Math.random() < 0.04) {
    subliminalGlyphs.push({ text: "0x7FFF", x: Math.random() * 540, y: Math.random() * 370, life: 25 });
  }
  for (let i = subliminalGlyphs.length - 1; i >= 0; i--) {
    subliminalGlyphs[i].life--;
    if (subliminalGlyphs[i].life <= 0) subliminalGlyphs.splice(i, 1);
  }

  if (!isUpsideDown && score >= 8 && flickerFrames <= 0 && flickerCooldown <= 0 && Math.random() < 0.035 * dt) {
    flickerFrames = 4;
    flickerCooldown = 300;
    playFlickerSound();
  }

  let touchedAnomalyThisFrame = false;
  let moveDistance = player.speed * dt;

  let nextX = player.x;
  if (keys["a"] || keys["arrowleft"]) nextX -= moveDistance;
  if (keys["d"] || keys["arrowright"]) nextX += moveDistance;
  nextX = Math.max(0, Math.min(canvas.width - player.size, nextX));
  
  let collidedX = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(nextX, player.y, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) { collidedX = true; break; }
    }
    if (checkCollision(nextX, player.y, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) { collidedX = true; touchedAnomalyThisFrame = true; }
  }
  if (!collidedX) player.x = nextX;

  let nextY = player.y;
  if (keys["w"] || keys["arrowup"]) nextY -= moveDistance;
  if (keys["s"] || keys["arrowdown"]) nextY += moveDistance;
  nextY = Math.max(0, Math.min(canvas.height - player.size, nextY));
  
  let collidedY = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(player.x, nextY, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) { collidedY = true; break; }
    }
    if (checkCollision(player.x, nextY, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) { collidedY = true; touchedAnomalyThisFrame = true; }
  }
  if (!collidedY) player.y = nextY;

  if (Math.abs(player.x - lastPlayerX) > 0.1 || Math.abs(player.y - lastPlayerY) > 0.1) {
    playerStillTimer = performance.now();
    lastPlayerX = player.x; lastPlayerY = player.y;
    if (isWhispering) {
      isWhispering = false;
      loreBox.style.color = isUpsideDown ? "#ff9999" : "#e0e0e0";
      loreBox.style.fontStyle = "normal";
      loreBox.innerText = savedLoreText;
    }
  } else if (!isWhispering && performance.now() - playerStillTimer > 10000) {
    isWhispering = true;
    loreBox.style.color = "#ff5252";
    loreBox.style.fontStyle = "italic";
    loreBox.innerText = (isUpsideDown ? abyssWhispers : edenWhispers)[Math.floor(Math.random() * 5)];
  }

  if (!isUpsideDown && touchedAnomalyThisFrame) handleAnomalyTouch();
  if (!isUpsideDown && forbiddenFruit.active && checkCollision(player.x, player.y, player.size, player.size, forbiddenFruit.x, forbiddenFruit.y, forbiddenFruit.size, forbiddenFruit.size)) {
    forbiddenFruit.active = false;
    triggerUpsideDown(true);
    return;
  }

  if (!isWatcherFleeing && checkCollision(player.x, player.y, player.size, player.size, item.x, item.y, item.size, item.size)) {
    if (!isUpsideDown) {
      playEdenCollectSound();
      score++;
      scoreText.innerText = `FRUITS GATHERED: ${score} / 20`;
      if (score >= 20) {
        gameOver = true; edenWon = true; saveEnding("eden");
        setLore("MATTHEW 25:21 — 'Well done, good and faithful servant.'");
      } else spawnItem();
    } else {
      if (isTrueAbyss) playPitCollectSound(); else playAbyssCollectSound();
      eyesCollected++;
      scoreText.innerText = `SEALS BROKEN: ${eyesCollected} / ${targetSeals}`;
      setLore(abyssLore[Math.min(eyesCollected - 1, abyssLore.length - 1)]);
      watcher.baseSpeed += isTrueAbyss ? 18 : 20;
      watcherStunTimer = 36; shakeTime = 20; phantomItem.active = false;
      
      if (eyesCollected >= targetSeals) {
        if (isTrueAbyss && !isWatcherFleeing) {
          isWatcherFleeing = true; fleeGraceTimer = 0.6; watcherStunTimer = 0; watcher.baseSpeed = 240;
          scoreText.innerText = "CONSUME THE WATCHER";
          setLore("HUNT IT DOWN BEFORE IT UNMAKES THE PIT.");
        } else if (!isTrueAbyss) {
          gameOver = true; won = true; saveEnding("revelation"); shakeTime = 9999;
        }
      } else spawnItem();
    }
  }

  if (isUpsideDown) {
    if (!isWatcherFleeing && !phantomItem.active && eyesCollected >= 1 && Math.random() < 0.12 * dt) spawnPhantomItem();
    const dx = player.x - watcher.x;
    const dy = player.y - watcher.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0) {
      let speed = watcher.baseSpeed;
      if (isWatcherFleeing) {
        watcherJukeTimer -= dt;
        if (watcherJukeTimer <= 0) { watcherJukeTimer = 0.4 + Math.random() * 0.4; watcherJukeOffset = (Math.random() < 0.5 ? 1 : -1) * 2; }
        let fx = -(dx / dist) - (dy / dist) * watcherJukeOffset;
        let fy = -(dy / dist) + (dx / dist) * watcherJukeOffset;
        watcher.x += fx * speed * dt; watcher.y += fy * speed * dt;
        watcherTrail.push({ x: watcher.x, y: watcher.y, life: 12 });
        if (watcherTrail.length > 8) watcherTrail.shift();
      } else {
        if (watcherStunTimer > 0) speed *= 0.25;
        watcher.x += (dx / dist) * speed * dt;
        watcher.y += (dy / dist) * speed * dt;
      }
    }
    for (let t of watcherTrail) t.life--;

    if (isWatcherFleeing && fleeGraceTimer <= 0 && checkCollision(player.x, player.y, player.size, player.size, watcher.x, watcher.y, watcher.size, watcher.size)) {
      playTrueEndingSound(); gameOver = true; trueWon = true; saveEnding("trueEnd"); shakeTime = 9999;
    }
    if (!isWatcherFleeing && !godMode && checkCollision(player.x, player.y, player.size, player.size, watcher.x + 4, watcher.y + 4, watcher.size - 8, watcher.size - 8)) {
      playDeathSound(); gameOver = true; won = false; saveEnding("death"); shakeTime = 9999;
    }
  }

  updateSanityBorder();
  glitchTimer += dt * 60;
}

function drawWatcher(wx, wy, wsize, fleeing = false) {
  if (fleeing) {
    for (let t of watcherTrail) {
      ctx.strokeStyle = `rgba(255, 23, 68, ${t.life / 15})`;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(t.x, t.y, wsize, wsize);
    }
  }
  ctx.save();
  ctx.translate(wx + wsize / 2, wy + wsize / 2);
  ctx.rotate(glitchTimer * 0.05);
  ctx.strokeStyle = fleeing ? "#fff" : (watcherStunTimer > 0 ? "#ff8a80" : "#ff1744");
  ctx.lineWidth = 2;
  ctx.strokeRect(-18, -18, 36, 36);
  ctx.rotate(Math.PI / 4);
  ctx.strokeRect(-18, -18, 36, 36);
  ctx.fillStyle = fleeing ? "#ff1744" : "#fff";
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);

  if (!isUpsideDown) {
    const isFlickering = flickerFrames > 0;
    ctx.fillStyle = isFlickering ? "#1c0303" : "#558b2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = isFlickering ? "#ff0000" : "#fff59d";
    for (let i = 0; i < 10; i++) ctx.fillRect((i * 59) % 580, (i * 83) % 380, 4, 4);

    ctx.fillStyle = "#ffd700";
    ctx.beginPath(); ctx.arc(item.x + 7, item.y + 7, 7, 0, Math.PI * 2); ctx.fill();

    if (forbiddenFruit.active) {
      ctx.fillStyle = "#ff1744";
      ctx.beginPath(); ctx.arc(forbiddenFruit.x + 7, forbiddenFruit.y + 7, 7, 0, Math.PI * 2); ctx.fill();
    }

    if (isFlickering) drawWatcher(anomaly.x - 15, anomaly.y - 10, 28);
    ctx.fillStyle = godMode ? "#ffd700" : "#ffffff";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    for (const tree of forestTrees) drawTree(tree.x, tree.y, tree.style);
    drawTree(anomaly.x, anomaly.y, anomaly.style);
  } else {
    ctx.fillStyle = isTrueAbyss ? "#050000" : "#090202";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
    for (let g of subliminalGlyphs) ctx.fillText(g.text, g.x, g.y);

    if (!isWatcherFleeing) {
      ctx.fillStyle = "#ff0000";
      ctx.beginPath(); ctx.arc(item.x + 7, item.y + 7, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = isWatcherFleeing ? "#ff1744" : "#b0bec5";
    ctx.fillRect(player.x, player.y, player.size, player.size);
    drawWatcher(watcher.x, watcher.y, watcher.size, isWatcherFleeing);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = edenWon || trueWon ? "#a8e6cf" : "#ff5252";
    ctx.font = "bold 22px Courier New";
    ctx.fillText(edenWon ? "THE OBEDIENT SHEPHERD" : (trueWon ? "ROOT ACCESS GRANTED" : "CAST INTO DARKNESS"), canvas.width / 2, 170);
    ctx.fillStyle = "#ccc"; ctx.font = "12px Courier New";
    ctx.fillText("Press [R] to restart", canvas.width / 2, 220);
  }
  ctx.restore();
}

let lastTime = performance.now();
function loop(currentTime) {
  let dt = (currentTime - lastTime) / 1000;
  if (dt > 0.1) dt = 0.1;
  lastTime = currentTime;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

updateSigilHUD();
checkForbiddenFruitSpawn();
requestAnimationFrame(loop);
</script>
</body>
</html>
