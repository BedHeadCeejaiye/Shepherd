<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0e1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
    color: white;
    user-select: none;
  }
  canvas {
    border: 3px solid #333;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    background-color: #558b2f;
    outline: none;
  }
  #hud {
    width: 600px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: bold;
  }
  #lore-box {
    width: 580px;
    min-height: 45px;
    margin-top: 10px;
    padding: 10px;
    background: #161a23;
    border-left: 4px solid #558b2f;
    font-size: 14px;
    line-height: 1.4;
    transition: all 0.5s ease;
  }
</style>
</head>
<body>

<div id="hud">
  <span id="score-text">FRUITS GATHERED: 0 / 20</span>
  <span id="realm-text" style="color: #a8e6cf;">REALM: EDEN'S GROVE</span>
</div>

<canvas id="gameCanvas" width="600" height="400" tabindex="0"></canvas>

<div id="lore-box">
  "The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score-text");
const realmText = document.getElementById("realm-text");
const loreBox = document.getElementById("lore-box");

canvas.focus();
canvas.addEventListener("click", () => canvas.focus());

let isUpsideDown = false;
let gameOver = false;
let won = false;
let edenWon = false;
let score = 0;
let eyesCollected = 0;
let forbiddenTouches = 0;
let shakeTime = 0;
let glitchTimer = 0;

const player = {
  x: 50,
  y: 200,
  size: 20,
  speed: 2.0
};

let item = {
  x: 300,
  y: 200,
  size: 14
};

const forestTrees = [
  { x: 60, y: 50, width: 45, height: 45 },
  { x: 180, y: 40, width: 45, height: 45 },
  { x: 310, y: 70, width: 45, height: 45 },
  { x: 440, y: 45, width: 45, height: 45 },
  { x: 120, y: 160, width: 45, height: 45 },
  { x: 250, y: 180, width: 45, height: 45 },
  { x: 400, y: 150, width: 45, height: 45 },
  { x: 70, y: 290, width: 45, height: 45 },
  { x: 190, y: 320, width: 45, height: 45 },
  { x: 330, y: 300, width: 45, height: 45 },
  { x: 450, y: 280, width: 45, height: 45 }
];

const anomaly = {
  x: 520,
  y: 190,
  width: 45,
  height: 45
};

const watcher = {
  x: 550,
  y: 50,
  size: 28,
  speed: 1.25
};

const abyssLore = [
  "GENESIS 3:24 — 'He drove out the man; and placed at the east of the garden Cherubims, and a flaming sword...'",
  "EZEKIEL 1:18 — 'As for their rings, they were so high that they were dreadful; and their rings were full of eyes round about them.'",
  "JOB 26:6 — 'Sheol is naked before Him, and Abaddon has no covering.'",
  "REVELATION 9:11 — 'They had as king over them the angel of the Abyss, whose name in Hebrew is Abaddon.'",
  "MATTHEW 8:12 — 'Thrown outside into the darkness, where there will be weeping and gnashing of teeth.'",
  "THE SEVENTH SEAL IS BROKEN. YOU CANNOT RETURN TO THE GROVE."
];

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if (gameOver && e.key.toLowerCase() === "r") {
    resetGame();
  }
});
window.addEventListener("keyup", (e) => {
  keys[e.key.toLowerCase()] = false;
});

function spawnItem() {
  let valid = false;
  while (!valid) {
    item.x = 40 + Math.random() * (canvas.width - 120);
    item.y = 40 + Math.random() * (canvas.height - 80);
    valid = true;
    if (!isUpsideDown) {
      for (const tree of forestTrees) {
        if (checkCollision(item.x, item.y, item.size, item.size, tree.x, tree.y, tree.width, tree.height)) {
          valid = false;
          break;
        }
      }
      if (checkCollision(item.x, item.y, item.size, item.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
        valid = false;
      }
    }
  }
}

function triggerUpsideDown() {
  isUpsideDown = true;
  shakeTime = 45;
  score = 0;
  player.x = 60;
  player.y = 200;
  watcher.x = 540;
  watcher.y = 200;
  
  realmText.innerText = "REALM: SHEOL // THE ABYSS";
  realmText.style.color = "#ff2a2a";
  scoreText.innerText = "SEALS BROKEN: 0 / 6";
  scoreText.style.color = "#ff2a2a";
  
  loreBox.style.background = "#1a0505";
  loreBox.style.borderLeft = "4px solid #ff0000";
  loreBox.style.color = "#ff9999";
  loreBox.innerText = "YOU ATE FROM THE FORBIDDEN ROOT. THE SKY HAS ROLLED UP LIKE A SCROLL.";
  spawnItem();
}

function handleAnomalyTouch() {
  forbiddenTouches++;
  shakeTime = 12;

  const dx = (player.x + player.size / 2) - (anomaly.x + anomaly.width / 2);
  const dy = (player.y + player.size / 2) - (anomaly.y + anomaly.height / 2);
  const dist = Math.hypot(dx, dy) || 1;
  player.x += (dx / dist) * 24;
  player.y += (dy / dist) * 24;

  if (forbiddenTouches === 1) {
    loreBox.innerText = "The bark of this particular tree is unnaturally cold to the touch...";
  } else if (forbiddenTouches === 2) {
    loreBox.innerText = "A drop of black sap leaks from the grain. Something feels wrong.";
  } else if (forbiddenTouches === 3) {
    loreBox.innerText = "You hear faint whispers echoing up through the roots... Turn back.";
  } else if (forbiddenTouches >= 4) {
    triggerUpsideDown();
  }
}

function resetGame() {
  isUpsideDown = false;
  gameOver = false;
  won = false;
  edenWon = false;
  score = 0;
  eyesCollected = 0;
  forbiddenTouches = 0;
  shakeTime = 0;
  player.x = 50;
  player.y = 200;
  watcher.speed = 1.25;
  
  realmText.innerText = "REALM: EDEN'S GROVE";
  realmText.style.color = "#a8e6cf";
  scoreText.innerText = "FRUITS GATHERED: 0 / 20";
  scoreText.style.color = "#ffffff";
  
  loreBox.style.background = "#161a23";
  loreBox.style.borderLeft = "4px solid #558b2f";
  loreBox.style.color = "#e0e0e0";
  loreBox.innerText = '"The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures..."';
  spawnItem();
}

function checkCollision(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Standard tree drawing function used for both decoys and the trigger tree
function drawTree(x, y) {
  ctx.fillStyle = "#2e1c0c";
  ctx.fillRect(x + 15, y + 20, 15, 25);
  ctx.fillStyle = "#1b4d1b";
  ctx.beginPath();
  ctx.arc(x + 22, y + 15, 22, 0, Math.PI * 2);
  ctx.fill();
}

function update() {
  if (shakeTime > 0) shakeTime--;
  if (gameOver) return;

  let touchedAnomalyThisFrame = false;

  let nextX = player.x;
  if (keys["a"] || keys["arrowleft"]) nextX -= player.speed;
  if (keys["d"] || keys["arrowright"]) nextX += player.speed;
  nextX = Math.max(0, Math.min(canvas.width - player.size, nextX));
  
  let collidedX = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(nextX, player.y, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) {
        collidedX = true;
        break;
      }
    }
    if (checkCollision(nextX, player.y, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
      collidedX = true;
      touchedAnomalyThisFrame = true;
    }
  }
  if (!collidedX) {
    player.x = nextX;
  }

  let nextY = player.y;
  if (keys["w"] || keys["arrowup"]) nextY -= player.speed;
  if (keys["s"] || keys["arrowdown"]) nextY += player.speed;
  nextY = Math.max(0, Math.min(canvas.height - player.size, nextY));
  
  let collidedY = false;
  if (!isUpsideDown) {
    for (const tree of forestTrees) {
      if (checkCollision(player.x, nextY, player.size, player.size, tree.x, tree.y, tree.width, tree.height)) {
        collidedY = true;
        break;
      }
    }
    if (checkCollision(player.x, nextY, player.size, player.size, anomaly.x, anomaly.y, anomaly.width, anomaly.height)) {
      collidedY = true;
      touchedAnomalyThisFrame = true;
    }
  }
  if (!collidedY) {
    player.y = nextY;
  }

  if (!isUpsideDown && touchedAnomalyThisFrame) {
    handleAnomalyTouch();
  }

  if (checkCollision(player.x, player.y, player.size, player.size, item.x, item.y, item.size, item.size)) {
    if (!isUpsideDown) {
      score++;
      scoreText.innerText = `FRUITS GATHERED: ${score} / 20`;
      if (score === 5) {
        loreBox.innerText = "Deep in the woods, the shadows grow long. Pay attention to where the grass has withered.";
      } else if (score === 12) {
        loreBox.innerText = "You remain faithful to the harvest, ignoring the strange pull from the east.";
      }
      
      if (score >= 20) {
        gameOver = true;
        edenWon = true;
        loreBox.innerText = "MATTHEW 25:21 — 'Well done, good and faithful servant. Enter into the joy of your master.'";
      } else {
        spawnItem();
      }
    } else {
      eyesCollected++;
      scoreText.innerText = `SEALS BROKEN: ${eyesCollected} / 6`;
      loreBox.innerText = abyssLore[Math.min(eyesCollected - 1, abyssLore.length - 1)];
      watcher.speed += 0.2;
      shakeTime = 20;
      
      if (eyesCollected >= 6) {
        gameOver = true;
        won = true;
        shakeTime = 9999;
      } else {
        spawnItem();
      }
    }
  }

  if (isUpsideDown) {
    const dx = player.x - watcher.x;
    const dy = player.y - watcher.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0) {
      watcher.x += (dx / dist) * watcher.speed;
      watcher.y += (dy / dist) * watcher.speed;
    }

    if (checkCollision(player.x, player.y, player.size, player.size, watcher.x, watcher.y, watcher.size, watcher.size)) {
      gameOver = true;
      won = false;
      shakeTime = 9999;
    }
  }

  glitchTimer++;
}

function draw() {
  ctx.save();

  if (shakeTime > 0) {
    const dx = (Math.random() - 0.5) * 14;
    const dy = (Math.random() - 0.5) * 14;
    ctx.translate(dx, dy);
  }

  if (!isUpsideDown) {
    ctx.fillStyle = "#558b2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle faded grass patch around the trigger tree (the only faint hint left)
    ctx.fillStyle = "#4a7527";
    ctx.beginPath();
    ctx.arc(anomaly.x + 22, anomaly.y + 20, 35, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff59d";
    for (let i = 0; i < 10; i++) {
      ctx.fillRect((i * 59) % 580, (i * 83) % 380, 4, 4);
    }

    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.arc(item.x + 7, item.y + 7, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(player.x, player.y, player.size, player.size);
    ctx.fillStyle = "#000000";
    ctx.fillRect(player.x + 12, player.y + 5, 3, 3);

    // Draw all decoy trees
    for (const tree of forestTrees) {
      drawTree(tree.x, tree.y);
    }

    // Draw the Trigger Tree (now completely identical to the decoys visually)
    drawTree(anomaly.x, anomaly.y);

  } else {
    ctx.fillStyle = "#090202";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#2a0808";
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 85, 0);
      ctx.lineTo(i * 85 + 15, 60);
      ctx.stroke();
    }

    if (glitchTimer % 10 < 2) {
      ctx.fillStyle = "rgba(255, 0, 0, 0.08)";
      ctx.fillRect(0, Math.random() * canvas.height, canvas.width, 4);
    }

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(item.x + 7, item.y + 7, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(item.x + 7, item.y + 7, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#b0bec5";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.save();
    ctx.translate(watcher.x + watcher.size / 2, watcher.y + watcher.size / 2);
    ctx.rotate(glitchTimer * 0.05);
    
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 2;
    ctx.strokeRect(-18, -18, 36, 36);
    ctx.rotate(Math.PI / 4);
    ctx.strokeRect(-18, -18, 36, 36);

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const gradient = ctx.createRadialGradient(
      player.x + 10, player.y + 10, 35,
      player.x + 10, player.y + 10, 210
    );
    gradient.addColorStop(0, "rgba(0, 0, 0, 0)");
    gradient.addColorStop(1, "rgba(0, 0, 0, 0.94)");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (gameOver) {
    ctx.textAlign = "center";

    if (edenWon) {
      ctx.fillStyle = "rgba(255, 248, 220, 0.90)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#2e7d32";
      ctx.font = "bold 22px Courier New";
      ctx.fillText("THE OBEDIENT SHEPHERD", canvas.width / 2, 150);
      ctx.fillStyle = "#333333";
      ctx.font = "13px Courier New";
      ctx.fillText("You tended the grove in peace and resisted temptation.", canvas.width / 2, 185);
      ctx.fillStyle = "#666666";
      ctx.font = "12px Courier New";
      ctx.fillText("Press [R] to replay... but something feels off.", canvas.width / 2, 235);
    } else if (won) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff5252";
      ctx.font = "bold 24px Courier New";
      ctx.fillText("BE NOT AFRAID.", canvas.width / 2, 160);
      ctx.fillStyle = "#cccccc";
      ctx.font = "14px Courier New";
      ctx.fillText("You gazed into the Abyss and survived the revelation.", canvas.width / 2, 195);
      ctx.fillText("Press [R] to return to the beginning.", canvas.width / 2, 240);
    } else {
      ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff0000";
      ctx.font = "bold 26px Courier New";
      ctx.fillText("CAST INTO OUTER DARKNESS", canvas.width / 2, 160);
      ctx.fillStyle = "#aaaaaa";
      ctx.font = "14px Courier New";
      ctx.fillText("Curiosity opened the pit. The Watcher claimed you.", canvas.width / 2, 195);
      ctx.fillText("Press [R] to try again.", canvas.width / 2, 240);
    }
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
